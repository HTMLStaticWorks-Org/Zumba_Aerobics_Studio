<!doctype html>
<html lang="en" dir="ltr">
<head>
  <title>Create Account | Pulse&amp;Motion</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ef476f">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <script defer src="assets/js/main.js"></script>
</head>
<body class="auth-body">
  <!-- RTL and Theme buttons outside the card at top right corner -->
  <div class="auth-top-actions">
    <button class="icon-btn" data-rtl-btn aria-label="Toggle right to left">RTL</button>
    <button class="icon-btn" data-theme-btn aria-label="Toggle theme">🌙</button>
  </div>

  <main class="auth-page">
    <!-- Centered Authentication Card (No images) -->
    <div class="auth-card">
      <!-- Brandname inside the card, aligned to center -->
      <div class="auth-brand-center">
        <a class="brand" href="index.html">
          <span class="brand-mark">✦</span>
          <span>Pulse<span><b>&amp;</b></span>Motion</span>
        </a>
      </div>

      <div class="auth-header">
        <span class="eyebrow">Join the Movement</span>
        <h1>Create Your Account</h1>
        <p class="auth-sub">Sign up in seconds and claim your first complimentary aerobics class.</p>
      </div>

      <form data-demo>
        <div class="field">
          <label for="full-name">Full name</label>
          <input id="full-name" type="text" placeholder="Alex Morgan" required autocomplete="name">
        </div>

        <div class="field">
          <label for="reg-email">Email address</label>
          <input id="reg-email" type="email" placeholder="alex@example.com" required autocomplete="email">
        </div>

        <div class="field">
          <label for="reg-password">Password</label>
          <input id="reg-password" type="password" placeholder="At least 8 characters" required autocomplete="new-password">
        </div>

        <div class="field">
          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" type="password" placeholder="Repeat your password" required autocomplete="new-password">
        </div>

        <!-- Terms and conditions checkbox (Required) -->
        <div class="auth-terms">
          <input type="checkbox" id="register-terms" name="terms" required>
          <label for="register-terms">I agree to the <a href="#">Terms and Conditions</a> &amp; <a href="#">Privacy Policy</a></label>
        </div>

        <button class="btn btn-block" type="submit">Create Account →</button>
        <div class="notice" data-notice hidden>Account registration demo. Connect your auth backend to persist accounts.</div>
      </form>

      <div class="auth-divider">or continue with</div>

      <!-- Social Media Icons properly aligned to center with NO repetition -->
      <div class="social-login-centered">
        <a href="#" class="social-login-btn" aria-label="Register with Google">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.24 10.285V13.4h6.887C18.2 16.27 15.65 18.2 12.24 18.2c-3.64 0-6.6-2.96-6.6-6.6s2.96-6.6 6.6-6.6c1.68 0 3.2.62 4.38 1.64l2.4-2.4C17.44 2.66 14.98 1.8 12.24 1.8 6.6 1.8 2 6.4 2 12s4.6 10.2 10.24 10.2c5.9 0 9.8-4.15 9.8-9.98 0-.67-.07-1.32-.2-1.935H12.24z"/></svg>
          <span>Google</span>
        </a>
        <a href="#" class="social-login-btn" aria-label="Register with Apple">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.38c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.99.6-2.63 1.35-.56.65-.96 1.7-0.83 2.73 1 .08 2.02-.48 2.53-1.23z"/></svg>
          <span>Apple</span>
        </a>
        <a href="#" class="social-login-btn" aria-label="Register with Facebook">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          <span>Facebook</span>
        </a>
      </div>

      <div class="auth-foot">
        Already a member? <a href="login.html">Sign in</a>
      </div>
      <div class="auth-foot" style="margin-top:12px">
        <a href="index.html">← Back to website</a>
      </div>
    </div>
  </main>
</body>
</html>
